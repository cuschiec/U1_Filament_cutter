[gcode_macro CUT]
description: Cut filament macro

# --- DEFAULT VALUES ---
variable_cut_pos_x: 7.1 
variable_cut_pos_y: 269.9       # Can't be 270
variable_actuate_x_1: 4.0       # First cut
variable_actuate_x_2: 6.0       # Second cut
variable_actuate_x_3: 6.5       # Third cut (for safety)
variable_pull_back: 22.0        # First retraction before cut, to reach softer part of the filament and reduce filament waste, if not printing "pull_back" = (22.0+10.0)
variable_release: 1.5           # Retraction after Cut to release the blade
variable_push_in: 12.0          # Extrusion to push back remaining filament into hotend
variable_pull_out: 12.0         # Retraction to pull the filament out of extruding gear 
variable_speed_move: 300        # Cut speed, to be multiplied: first cut *3, second cut *4, third cut *5
variable_speed_rapid: 15000     # Rapid movement
variable_speed_retract_1: 600   # Slow retraction speed
variable_speed_retract_2: 900   # Fast retraction speed
variable_temp_cut: 250          # Fallback temp, print/swap temperature will be used if available
#variable_temp_end: 0            # deprecated, will be set 0° to safety, if needed 

gcode:
    # --- PARAMETERS READING & MAPPING ---
    
    # 1. Smart temperature: use current extruder target if hot, otherwise fallback (250)
    {% set current_target = printer[printer.toolhead.extruder].target|float %}
    {% set base_temp = current_target if current_target > 170 else printer["gcode_macro CUT"].temp_cut %}
    {% set target_temp_cut = params.TEMP_CUT|default(base_temp)|int %}

    # Other command-line parameters (use defaults if not passed)
    #{% set target_temp_end = params.TEMP_END|default(printer["gcode_macro CUT"].temp_end)|int %}
    {% set target_pull_out = params.PULL_OUT|default(printer["gcode_macro CUT"].pull_out)|float %}
    {% set target_actuate_x_1 = params.ACTUATE_X_1|default(printer["gcode_macro CUT"].actuate_x_1)|float %}
    {% set target_actuate_x_2 = params.ACTUATE_X_2|default(printer["gcode_macro CUT"].actuate_x_2)|float %}
    {% set target_actuate_x_3 = params.ACTUATE_X_3|default(printer["gcode_macro CUT"].actuate_x_3)|float %}
    {% set target_speed_retract_1 = params.SPEED_RETRACT_1|default(printer["gcode_macro CUT"].speed_retract_1)|float %}
    {% set target_speed_retract_2 = params.SPEED_RETRACT_2|default(printer["gcode_macro CUT"].speed_retract_2)|float %}

    # 2. Local variables for FIXED parameters (for clean syntax in movements)
    {% set cut_pos_x = printer["gcode_macro CUT"].cut_pos_x|float %}
    {% set cut_pos_y = printer["gcode_macro CUT"].cut_pos_y|float %}
    {% set release = printer["gcode_macro CUT"].release|float %}
    {% set push_in = printer["gcode_macro CUT"].push_in|float %}
    {% set pull_out = printer["gcode_macro CUT"].pull_out|float %}
    {% set speed_move = printer["gcode_macro CUT"].speed_move|float %}
    {% set speed_rapid = printer["gcode_macro CUT"].speed_rapid|float %}

    # --- CONTEXTUAL LOGIC FOR PULL_BACK ---
    {% set default_pull_back = printer["gcode_macro CUT"].pull_back|float %}
    {% set is_printing = (printer.print_stats.state == "printing") %}
    
    # Jinja2 safe scoping: set variable outside the block
    {% set calc_pull_back = default_pull_back if is_printing else (default_pull_back + 10.0) %}
    {% set target_pull_back = params.PULL_BACK|default(calc_pull_back)|float %}

    {% if is_printing %}
        # Print in progress: Orca Slicer already applied its toolchange retraction
        M118 Print detected. Pull back: {target_pull_back}mm.
    {% else %}
        # Machine idle: Manual unload, we need to compensate by adding 8mm
        M118 Manual unload detected. Compensated pull back: {target_pull_back}mm.
    {% endif %}

    # --- GCODE EXECUTION ---
    M109 S{target_temp_cut}

    G90
    M83

    # 0. Smart approach (Anti-collision)
    {% set current_x = printer.toolhead.position.x %}
    {% if current_x < cut_pos_x %}
        # If toolhead is on the left: Move X first, then Y
        G0 X{cut_pos_x + 2} F{speed_rapid}
        G0 Y{cut_pos_y} F{speed_rapid}
    {% else %}
        # If toolhead is on the right (or on the spot): Move Y first, then X
        G0 Y{cut_pos_y} F{speed_rapid}
        G0 X{cut_pos_x + 2} F{speed_rapid}
    {% endif %}

    G0 X{cut_pos_x} F{speed_rapid}


    G91
    # 1. First retraction (softer filament and less waste to be purged)
    G1 E-{target_pull_back} F{target_speed_retract_1}

    M400
    # Temporary current increase on stepper drivers for the cut
    SET_TMC_CURRENT STEPPER=stepper_x CURRENT=1.41
    SET_TMC_CURRENT STEPPER=stepper_y CURRENT=1.41

    # 2. First actuation (Partial cut)
    G1 X-{target_actuate_x_1} F{speed_move * 3}
    G0 X+{target_actuate_x_1} F{speed_rapid}

    # 3. Second actuation (Full cut)
    G1 X-{target_actuate_x_2} F{speed_move * 4}
    G0 X+{target_actuate_x_2} F{speed_rapid}

    # 4. Third actuation (Safety cut)
    G1 X-{target_actuate_x_3} F{speed_move * 5}
    G0 X+{target_actuate_x_3 + 2} F{speed_rapid}
    
    M400
    # Restore stepper motors current to normal values
    SET_TMC_CURRENT STEPPER=stepper_x CURRENT=1.20
    SET_TMC_CURRENT STEPPER=stepper_y CURRENT=1.20

    # Disengagement movements
    G0 E-{release} F{target_speed_retract_1}
    G4 P500
    G0 E{release + push_in} F{target_speed_retract_2}

    # 5. Second retraction (out of extruding gears)
    #G4 P500
    G0 E-{push_in + pull_out} F{target_speed_retract_2}

    G90
    G4 P2000
